name: ${LUMINA_COMPOSE_PROJECT:-lumina-crm}

x-proxy-free-environment: &proxy-free-environment
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: postgres,web,worker,localhost,127.0.0.1,::1
  no_proxy: postgres,web,worker,localhost,127.0.0.1,::1

x-application-security: &application-security
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
  pids_limit: 256
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      <<: *proxy-free-environment
      POSTGRES_DB: lumina_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - max_connections=120
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - statement_timeout=120s
      - -c
      - idle_in_transaction_session_timeout=60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --host 127.0.0.1 --port 5432 --username postgres --dbname lumina_crm"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_superuser_password
    tmpfs:
      - /var/run/postgresql:rw,nosuid,nodev,uid=999,gid=999,mode=0775
    shm_size: 256mb
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "8"

  web:
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/web_runtime_env
      VINEXT_TRUST_PROXY: "1"
      VINEXT_TRUSTED_HOSTS: ${LUMINA_PUBLIC_HOSTNAME:-crm.example.invalid}
    ports:
      - "${LUMINA_WEB_BIND:-127.0.0.1:3200}:3200"
    networks:
      - backend
      - edge
    volumes:
      - objects:/var/lib/lumina-crm/objects
    secrets:
      - web_runtime_env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "scripts/container-entrypoint.mjs", "web-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 1536m
    cpus: 2.0

  worker:
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/worker_runtime_env
      WORKER_LOOP_INTERVAL_SECONDS: ${WORKER_LOOP_INTERVAL_SECONDS:-300}
    networks:
      - backend
      - edge
    volumes:
      - objects:/var/lib/lumina-crm/objects
    secrets:
      - worker_runtime_env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "scripts/container-entrypoint.mjs", "worker-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 3m
    mem_limit: 1536m
    cpus: 2.0

  migration-verify:
    profiles: ["ops"]
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: "no"
    command: ["migration-verify"]
    environment:
      <<: *proxy-free-environment
    network_mode: none

  db-bootstrap:
    profiles: ["ops"]
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: "no"
    command: ["db-bootstrap"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/database_bootstrap_env
    networks:
      - backend
    secrets:
      - database_bootstrap_env
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: ["ops"]
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/migration_env
    networks:
      - backend
    secrets:
      - migration_env
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-admin:
    profiles: ["ops"]
    image: ${LUMINA_IMAGE:-lumina-crm:local-validation}
    <<: *application-security
    restart: "no"
    command: ["bootstrap-admin"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/bootstrap_admin_env
    networks:
      - backend
    secrets:
      - bootstrap_admin_env
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    profiles: ["ops"]
    image: ${LUMINA_OPS_IMAGE:-lumina-crm-ops:local-validation}
    <<: *application-security
    restart: "no"
    command: ["backup"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/backup_env
    networks:
      - backend
      - edge
    volumes:
      - backups:/var/lib/lumina-crm/backups
      - objects:/var/lib/lumina-crm/objects:ro
    secrets:
      - backup_env
    depends_on:
      postgres:
        condition: service_healthy

  restore-test:
    profiles: ["ops"]
    image: ${LUMINA_OPS_IMAGE:-lumina-crm-ops:local-validation}
    <<: *application-security
    restart: "no"
    command: ["restore-test"]
    environment:
      <<: *proxy-free-environment
      LUMINA_ENV_FILES: /run/secrets/restore_env
    networks:
      - backend
    volumes:
      - backups:/var/lib/lumina-crm/backups:ro
    secrets:
      - restore_env
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:
    name: ${LUMINA_BACKEND_NETWORK:-lumina-crm-backend}
    internal: true
    labels:
      com.lumina.crm.managed: "true"
      com.lumina.crm.repository: kewtgh/crm
  edge:
    name: ${LUMINA_EDGE_NETWORK:-lumina-crm-edge}
    labels:
      com.lumina.crm.managed: "true"
      com.lumina.crm.repository: kewtgh/crm

volumes:
  postgres_data:
    external: true
    name: ${LUMINA_POSTGRES_VOLUME:-lumina-crm-postgres-data}
  objects:
    external: true
    name: ${LUMINA_OBJECTS_VOLUME:-lumina-crm-objects}
  backups:
    external: true
    name: ${LUMINA_BACKUPS_VOLUME:-lumina-crm-backups}

secrets:
  postgres_superuser_password:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/postgres-superuser-password.txt
  web_runtime_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/production.env
  worker_runtime_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/worker.env
  database_bootstrap_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/database-bootstrap.env
  migration_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/migration.env
  bootstrap_admin_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/bootstrap-admin.env
  backup_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/backup.env
  restore_env:
    file: ${LUMINA_SECRETS_DIR:-./deploy/secrets}/restore.env
