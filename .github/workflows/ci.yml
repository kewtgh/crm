name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm 12
        run: npm install --global npm@12.2.0 && npm --version

      - name: Check release metadata and lockfile alignment
        run: node scripts/check-release-metadata.mjs

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Check types
        timeout-minutes: 3
        run: npm run typecheck

      - name: Check public repository privacy contracts
        run: npm run test:public-privacy

      - name: Lint
        timeout-minutes: 4
        run: npm run lint

      - name: Build and test
        timeout-minutes: 8
        run: npm test

      - name: Audit dependencies
        timeout-minutes: 3
        run: |
          npm audit --audit-level=moderate
          npm --prefix infrastructure/email-delivery-worker audit --audit-level=moderate
          npm --prefix planning-source/education-intelligent-crm-planning-v1 audit --audit-level=moderate

  database:
    name: PostgreSQL migrations and auth/RLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      DO_NOT_TRACK: "1"
      DATABASE_ADMIN_URL: postgresql://postgres:lumina-local-admin-only@127.0.0.1:55432/lumina_crm
      DATABASE_URL: postgresql://crm_app:local-app-password@127.0.0.1:55432/lumina_crm
      SYSTEM_DATABASE_URL: postgresql://crm_system:local-system-password@127.0.0.1:55432/lumina_crm
      WORKER_DATABASE_URL: postgresql://crm_worker:local-worker-password@127.0.0.1:55432/lumina_crm
      MIGRATION_DATABASE_URL: postgresql://crm_migrator:local-migrator-password@127.0.0.1:55432/lumina_crm
      CRM_APP_DB_PASSWORD: local-app-password
      CRM_SYSTEM_DB_PASSWORD: local-system-password
      CRM_WORKER_DB_PASSWORD: local-worker-password
      CRM_MIGRATOR_DB_PASSWORD: local-migrator-password
      CRM_BACKUP_DB_PASSWORD: local-backup-password
      CRM_WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INVITATION_CREDENTIAL_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      LOGIN_THROTTLE_HASH_SECRET: local-ci-login-throttle-hash-secret-2026
      TRUSTED_DEVICE_HASH_SECRET: local-ci-trusted-device-hash-secret-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm 12
        run: npm install --global npm@12.2.0 && npm --version

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Start pinned local database stack
        timeout-minutes: 10
        run: docker compose -f compose.postgres.yml up -d --wait

      - name: Bootstrap least-privilege database roles
        timeout-minutes: 3
        run: npm run db:bootstrap

      - name: Apply and verify PostgreSQL migrations
        timeout-minutes: 4
        run: npm run db:migrate && npm run db:migrations:verify

      - name: Validate schema and auth/RLS behavior
        timeout-minutes: 4
        run: npm run db:validate && npm run db:smoke

      - name: Stop local database stack
        if: always()
        timeout-minutes: 3
        run: docker compose -f compose.postgres.yml down
