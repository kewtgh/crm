name: Full release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: full-release-gate
  cancel-in-progress: false

jobs:
  release:
    name: Business, authentication, and Chromium 1243 release QA
    runs-on: [self-hosted, windows, chromium-1243]
    timeout-minutes: 35
    env:
      CI: true
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      WRANGLER_WRITE_LOGS: "false"
      APP_URL: http://localhost:3200
      QA_BASE_URL: http://localhost:3200

    steps:
      - name: Mask private runner paths
        shell: powershell
        run: |
          foreach ($runnerPath in @($env:USERPROFILE, $env:LOCALAPPDATA, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            if ($runnerPath) { Write-Output "::add-mask::$runnerPath" }
          }

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm 12
        run: npm install --global npm@12.2.0 && npm --version

      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Verify pinned browser runtime is already installed
        shell: powershell
        run: |
          $browserPath = Join-Path $env:LOCALAPPDATA "ms-playwright\chromium-1243\chrome-win64\chrome.exe"
          if (-not (Test-Path $browserPath)) {
            throw "Pinned ms-playwright/chromium-1243 is required on this runner"
          }
          "PLAYWRIGHT_CHROMIUM_1243_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure isolated local PostgreSQL release environment
        timeout-minutes: 10
        run: npm run ci:private-stage -- configure

      - name: Run bounded full release gate
        timeout-minutes: 20
        run: npm run ci:private-stage -- release

      - name: Prepare allowlisted public QA summary
        if: always()
        id: public_summary
        run: node scripts/publish-public-ci-artifacts.mjs

      - name: Upload allowlisted public QA summary
        if: ${{ always() && steps.public_summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-browser-qa-summary
          path: work/public-artifacts/browser-qa-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop local CRM PostgreSQL stack
        if: always()
        timeout-minutes: 3
        run: npm run ci:private-stage -- cleanup
