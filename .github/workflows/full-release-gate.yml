name: Full release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: full-release-gate
  cancel-in-progress: false

jobs:
  release:
    name: Business, authentication, and Chromium 1228 release QA
    runs-on: [self-hosted, windows, chromium-1228]
    timeout-minutes: 35
    env:
      CI: true
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      WRANGLER_WRITE_LOGS: "false"
      APP_URL: http://localhost:3200
      QA_BASE_URL: http://localhost:3200

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Verify pinned browser runtime is already installed
        shell: powershell
        run: |
          $browserPath = Join-Path $env:LOCALAPPDATA "ms-playwright\chromium-1228\chrome-win64\chrome.exe"
          if (-not (Test-Path $browserPath)) {
            throw "Pinned ms-playwright/chromium-1228 is required on this runner"
          }
          "PLAYWRIGHT_CHROMIUM_1228_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start migrated local Supabase stack
        timeout-minutes: 10
        run: npx supabase start

      - name: Configure isolated local release environment
        timeout-minutes: 2
        run: npm run env:configure-local

      - name: Bootstrap release identities
        timeout-minutes: 3
        run: npm run auth:bootstrap-admin

      - name: Run bounded full release gate
        timeout-minutes: 20
        run: npm run release:gate

      - name: Upload fixed-browser QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-chromium-1228
          path: work/browser-qa-chromium-1228/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        timeout-minutes: 3
        run: npx supabase stop --no-backup
