name: Deployment V2 offline Alpha

on:
  pull_request:
    paths: ["deployment-v2-agent/**", "deployment-v2-m1/**", ".github/workflows/deployment-v2-agent.yml", ".nvmrc"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Alpha typecheck and lint
        run: |
          node node_modules/@typescript/native/bin/tsc -p deployment-v2-agent/tsconfig.json
          node node_modules/eslint/bin/eslint.js deployment-v2-agent/src deployment-v2-agent/tools deployment-v2-agent/tests
      - name: Retain M1 tests on native Linux
        run: node scripts/run-bounded.mjs --label m1-linux --timeout-seconds 55 --idle-seconds 45 -- node --test --test-concurrency=1 deployment-v2-m1/tests/*.test.mjs
      - name: Alpha native SQLite, flock, filesystem, crypto and termination
        run: node scripts/run-bounded.mjs --label m2-linux --timeout-seconds 55 --idle-seconds 45 -- node --test --test-concurrency=1 deployment-v2-agent/tests/*.test.mjs
      - name: Prepare fixed Compose and fictional workload image
        run: |
          mkdir -p work/deployment-v2-m2
          curl --fail --location --max-time 45 https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 --output work/deployment-v2-m2/compose
          echo 'dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372  work/deployment-v2-m2/compose' | sha256sum --check
          chmod 700 work/deployment-v2-m2/compose
          docker pull node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
      - name: Real Compose parser
        env:
          M1_COMPOSE_BINARY: ${{ github.workspace }}/work/deployment-v2-m2/compose
        run: node deployment-v2-m1/tools/compose-integration.ts
      - name: Real Compose synthetic workload with existing CI Docker
        env:
          M2_NONPRODUCTION_DOCKER: ACK_NONPRODUCTION
          M2_DOCKER_ENDPOINT: unix:///var/run/docker.sock
          M2_COMPOSE_BINARY: ${{ github.workspace }}/work/deployment-v2-m2/compose
        run: node scripts/run-bounded.mjs --label m2-compose --timeout-seconds 55 --idle-seconds 45 -- node deployment-v2-agent/tools/compose.ts
      - name: Public privacy contracts
        run: npm run test:public-privacy
      # No publication, signing credentials, production secrets, self-hosted runner,
      # systemd installation, Rootless provisioning, reboot, or application deployment.
