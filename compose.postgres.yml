services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: lumina_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-lumina-local-admin-only}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lumina_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumina_crm"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  lumina_postgres_data:
